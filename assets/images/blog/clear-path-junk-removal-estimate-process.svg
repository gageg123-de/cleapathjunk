<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">How to get a Clear Path estimate</title><desc id="desc">Three steps: send photos, include access details, and receive your estimate.</desc>
  <rect width="1200" height="1500" rx="48" fill="#f7f8f5"/><path d="M72 46h1056a26 26 0 0 1 26 26v1356a26 26 0 0 1-26 26H72a26 26 0 0 1-26-26V72a26 26 0 0 1 26-26Z" fill="none" stroke="#e2e7e2" stroke-width="4"/>
  <text x="88" y="112" fill="#1f7a3d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="4">PHOTO ESTIMATE GUIDE</text><text x="88" y="185" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">How to Get a</text><text x="88" y="246" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">Clear Path Estimate</text><text x="88" y="298" fill="#667066" font-family="Arial,Helvetica,sans-serif" font-size="26">Three useful steps help us understand the scope.</text>
  <path d="M132 506v200M132 846v200" fill="none" stroke="#c7dbc9" stroke-width="6" stroke-dasharray="10 14"/>
  <g transform="translate(72 366)"><rect width="1056" height="286" rx="32" fill="#fff" stroke="#dfe6df" stroke-width="3"/><circle cx="60" cy="60" r="36" fill="#1f7a3d"/><text x="60" y="72" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">1</text><rect x="34" y="112" width="196" height="132" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><rect x="76" y="128" width="112" height="94" rx="15"/><circle cx="132" cy="175" r="24"/><path d="M103 128l10-17h38l10 17"/></g><text x="274" y="112" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Send photos</text><text x="274" y="162" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="26">Start with wide shots of the full scope.</text><text x="274" y="202" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="26">Add close-ups when an item needs context.</text></g>
  <g transform="translate(72 706)"><rect width="1056" height="286" rx="32" fill="#fff" stroke="#dfe6df" stroke-width="3"/><circle cx="60" cy="60" r="36" fill="#1f7a3d"/><text x="60" y="72" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">2</text><rect x="34" y="112" width="196" height="132" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M66 222h38v-34h34v-34h38v-34h24M65 120v102h135"/></g><text x="274" y="112" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Include access details</text><text x="274" y="162" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="26">Mention stairs, gates, distance, or tight</text><text x="274" y="202" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="26">spaces—and identify unusually heavy items.</text></g>
  <g transform="translate(72 1046)"><rect width="1056" height="320" rx="32" fill="#0b2a18"/><circle cx="60" cy="60" r="36" fill="#8bd19d"/><text x="60" y="72" text-anchor="middle" fill="#0b2a18" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">3</text><rect x="34" y="126" width="196" height="132" rx="24" fill="#fff" opacity=".1"/><g fill="none" stroke="#8bd19d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><rect x="76" y="141" width="112" height="96" rx="12"/><path d="M108 141v-14h48v14M101 190l18 18 44-48"/></g><text x="274" y="126" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800">Receive your estimate</text><text x="274" y="176" fill="#d7e8dc" font-family="Arial,Helvetica,sans-serif" font-size="26">Clear Path reviews the visible scope and</text><text x="274" y="216" fill="#d7e8dc" font-family="Arial,Helvetica,sans-serif" font-size="26">access details, then provides the estimate.</text></g>
</svg>
