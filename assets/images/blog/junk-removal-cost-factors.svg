<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">What affects junk removal cost?</title><desc id="desc">Five factors: volume, material, access, weight, and special handling or disposal requirements.</desc>
  <rect width="1200" height="1500" rx="48" fill="#f7f8f5"/><path d="M72 46h1056a26 26 0 0 1 26 26v1356a26 26 0 0 1-26 26H72a26 26 0 0 1-26-26V72a26 26 0 0 1 26-26Z" fill="none" stroke="#e2e7e2" stroke-width="4"/>
  <text x="88" y="112" fill="#1f7a3d" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="4">CLEAR PATH COST GUIDE</text><text x="88" y="185" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">What Affects</text><text x="88" y="246" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">Junk Removal Cost?</text><text x="88" y="298" fill="#667066" font-family="Arial,Helvetica,sans-serif" font-size="26">A clear estimate considers the complete removal scope.</text>
  <g transform="translate(72 354)"><rect width="1056" height="186" rx="28" fill="#fff" stroke="#dfe6df" stroke-width="3"/><rect x="26" y="26" width="134" height="134" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M58 91h70v44H58zM74 59h53v32H74zM60 91l16 12 16-12 18 12 18-12"/></g><text x="194" y="73" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">Volume</text><text x="194" y="119" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">How much space the material takes up</text><text x="194" y="151" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">when it is loaded.</text></g>
  <g transform="translate(72 562)"><rect width="1056" height="186" rx="28" fill="#fff" stroke="#dfe6df" stroke-width="3"/><rect x="26" y="26" width="134" height="134" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M55 83h48v43H55zM103 96h30v30h-30M64 126v12m59-12v12M72 83V67h24v16"/></g><text x="194" y="73" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">Material</text><text x="194" y="119" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">Furniture, household junk, yard debris,</text><text x="194" y="151" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">and other item types.</text></g>
  <g transform="translate(72 770)"><rect width="1056" height="186" rx="28" fill="#fff" stroke="#dfe6df" stroke-width="3"/><rect x="26" y="26" width="134" height="134" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M53 132h24v-25h23V82h27V57h15M52 56v76h90"/></g><text x="194" y="73" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">Access</text><text x="194" y="119" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">Stairs, distance, tight spaces, and</text><text x="194" y="151" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">loading difficulty.</text></g>
  <g transform="translate(72 978)"><rect width="1056" height="186" rx="28" fill="#fff" stroke="#dfe6df" stroke-width="3"/><rect x="26" y="26" width="134" height="134" rx="24" fill="#eaf4ec"/><g fill="none" stroke="#1f7a3d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M58 132h78l-9-60H67zM81 72a16 16 0 0 1 32 0M84 102h26M97 102l9-10"/></g><text x="194" y="73" fill="#17231b" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">Weight</text><text x="194" y="119" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">Dense debris can affect handling and</text><text x="194" y="151" fill="#4d584f" font-family="Arial,Helvetica,sans-serif" font-size="25">disposal requirements.</text></g>
  <g transform="translate(72 1186)"><rect width="1056" height="222" rx="28" fill="#0b2a18"/><rect x="26" y="44" width="134" height="134" rx="24" fill="#fff" opacity=".1"/><g fill="none" stroke="#8bd19d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M91 66 57 129h78zM96 90v19m0 14h.1"/></g><text x="194" y="86" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="800">Special handling</text><text x="194" y="132" fill="#d7e8dc" font-family="Arial,Helvetica,sans-serif" font-size="25">Some materials require additional care,</text><text x="194" y="164" fill="#d7e8dc" font-family="Arial,Helvetica,sans-serif" font-size="25">planning, or disposal arrangements.</text></g>
</svg>
