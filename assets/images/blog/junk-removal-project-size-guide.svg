<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">From one item to a full property cleanout</title>
  <desc id="desc">A four-stage progression from one bulky item through a small load and larger cleanout to a full property cleanout.</desc>
  <rect width="1000" height="760" rx="44" fill="#0b2a18"/>
  <text x="64" y="82" fill="#88ce9b" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3">PROJECT SIZE GUIDE</text>
  <text x="64" y="137" fill="#fff" font-family="Arial, sans-serif" font-size="46" font-weight="800">From One Item to a Full Cleanout</text>
  <path d="M74 632H920" fill="none" stroke="#88ce9b" stroke-width="6" stroke-linecap="round" opacity=".55"/><path d="m920 632-28-18v36z" fill="#d4af37"/>
  <g transform="translate(60 218)"><rect width="200" height="370" rx="28" fill="#fff"/><g transform="translate(42 66)" fill="none" stroke="#1f7a3d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M12 94V62c0-25 18-40 40-40h18c23 0 40 15 40 40v32M4 94h114v64H4zM22 158v24M98 158v24"/></g><text x="100" y="278" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="31" font-weight="800">Single Item</text><text x="100" y="318" text-anchor="middle" fill="#667066" font-family="Arial, sans-serif" font-size="22">One bulky piece</text></g>
  <g transform="translate(286 218)"><rect width="200" height="370" rx="28" fill="#fff"/><g transform="translate(31 54)" fill="none" stroke="#1f7a3d" stroke-width="10" stroke-linejoin="round"><path d="m4 68 50-28 50 28-50 29zM4 68v60l50 29 50-29V68M54 97v60"/><path d="m58 42 34-20 40 23-30 21" opacity=".45"/><path d="M20 164h112" stroke="#d4af37" stroke-linecap="round"/></g><text x="100" y="278" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="31" font-weight="800">Small Load</text><text x="100" y="318" text-anchor="middle" fill="#667066" font-family="Arial, sans-serif" font-size="22">A defined pile</text></g>
  <g transform="translate(512 218)"><rect width="200" height="370" rx="28" fill="#fff"/><g transform="translate(25 45)" fill="none" stroke="#1f7a3d" stroke-width="10" stroke-linejoin="round"><rect x="0" y="70" width="64" height="70" rx="7"/><rect x="84" y="34" width="64" height="106" rx="7"/><path d="M8 70 32 45l24 25M92 34l24-24 24 24M0 156h148" stroke-linecap="round"/></g><text x="100" y="268" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="29" font-weight="800">Larger</text><text x="100" y="304" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="29" font-weight="800">Cleanout</text><text x="100" y="338" text-anchor="middle" fill="#667066" font-family="Arial, sans-serif" font-size="22">Multiple items</text></g>
  <g transform="translate(738 218)"><rect width="200" height="370" rx="28" fill="#f4fbf6" stroke="#88ce9b" stroke-width="4"/><g transform="translate(24 42)" fill="none" stroke="#1f7a3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="m4 82 72-62 72 62M20 72v92h112V72M62 164v-54h32v54M38 102h18M104 102h18"/><path d="M5 182h142" stroke="#d4af37"/></g><text x="100" y="268" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="28" font-weight="800">Full Property</text><text x="100" y="304" text-anchor="middle" fill="#1b1b1b" font-family="Arial, sans-serif" font-size="28" font-weight="800">Cleanout</text><text x="100" y="338" text-anchor="middle" fill="#667066" font-family="Arial, sans-serif" font-size="22">Room-by-room scope</text></g>
  <text x="500" y="704" text-anchor="middle" fill="#c9d8cd" font-family="Arial, sans-serif" font-size="25">More material usually means more space, handling, and planning.</text>
</svg>
